<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Night Drive Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>The Night</h1>
        <h2>Drive Home</h2>

        <p>Dark outside. Streets are empty.
           Just the street lights, rain and the drive home.</p>

        <div class="scene">
            <img id="road" src="images/nightroad.jpg"
                 alt="An empty road at night">
            <div id="rain"></div>
        </div>

        <p id="message">Press play to begin your drive.</p>

        <button id="play-button">Play Soundscape</button>
        <button id="rain-button">Turn Rain On</button>

        <audio id="drive-audio">
            <source src="audio/drive.wav" type="audio/wav">
        </audio>
    </main>

    <script src="script.js"></script>

</body>
</html>
